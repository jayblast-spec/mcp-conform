[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-conform"
version = "0.1.0"
description = "Spec-compliance checker for MCP (Model Context Protocol) servers — stdio and Streamable HTTP."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    # Pinned exact, not >=: mcp 2.x renamed/moved streamablehttp_client,
    # breaking this import at collection time (caught by CI on a fresh
    # install pulling latest — see commit history). Pin until that's
    # verified against the 2.x API and updated deliberately.
    "mcp[cli]==1.29.1",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-conform = "mcp_conform.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_conform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
